<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CI/CD Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🚀 My Static Website</h1>
        <p>Deployed using AWS CodePipeline + S3</p>
    </header>

    <main>
        <section class="card">
            <h2>Welcome 👋</h2>
            <p>This site is automatically deployed using CI/CD.</p>
            <button onclick="showMessage()">Click Me</button>
            <p id="message"></p>
        </section>

        <section class="card">
            <h2>Live Time ⏰</h2>
            <p id="time"></p>
        </section>
    </main>

    <footer>
        <p>Made with ❤️ using AWS</p>
    </footer>

    <script src="script.js"></script>
</body>
  </html>
